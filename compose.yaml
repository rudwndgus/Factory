services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment:
      DATA_DIR: /data
      FFMPEG_PATH: /usr/bin/ffmpeg
    volumes:
      - factory-data:/data
      - ./media_library:/app/media_library:ro
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports: ["8080:80"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  factory-data:
